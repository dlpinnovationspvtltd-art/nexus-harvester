name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Standalone Windows EXE
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile Standalone Windows EXE
      run: |
        pyinstaller --noconsole --onefile --clean --add-data "icon_512x512.png;." --name "Nexus Harvester" NexusHarvester.py

    - name: Verify Executable Created
      run: |
        if (Test-Path "dist\Nexus Harvester.exe") {
          Write-Host "Success: Nexus Harvester.exe compiled successfully!"
          Get-Item "dist\Nexus Harvester.exe" | Select-Object Name, Length, LastWriteTime
        } else {
          Write-Error "Error: Nexus Harvester.exe was not found in dist folder."
          exit 1
        }

    - name: Upload Windows EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nexus-Harvester-Windows-EXE
        path: dist/Nexus Harvester.exe
        retention-days: 30
